name: meta-length

# Fails the PR when a hand-coded page's `const title` / `const description`
# is outside the same length bands the article scorer uses
# (`scoring.seo.title` / `scoring.seo.excerpt`), or contains an HTML entity.
# Articles are covered by geo-floor; this covers everything else in src/pages.

on:
  pull_request:
    paths:
      - 'src/pages/**'
      - 'jeldon.config.ts'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  meta-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check title/description length on static pages
        run: pnpm run check:meta
