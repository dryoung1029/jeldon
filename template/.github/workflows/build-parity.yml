name: build-parity

# Proves production AND preview builds both succeed. The INCLUDE_DRAFTS=true
# pass exercises the draft-inclusive render path (preview deploys) so a broken
# draft can't ship silently; both builds must keep drafts + stubs out of the
# sitemap.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production build (drafts excluded)
        run: pnpm run build

      - name: Preview build (INCLUDE_DRAFTS=true)
        run: pnpm run build
        env:
          INCLUDE_DRAFTS: 'true'
