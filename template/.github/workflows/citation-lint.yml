name: citation-lint

# Runs @jeldon/verify's citation linter over every article, driven by
# pack.citation.policy. Under 'search-urls-only' it flags fabricated-citation
# patterns; under 'direct-source-urls' / 'verifier-required' it is a no-op.

on:
  pull_request:
    paths:
      - 'src/content/articles/**'
      - 'jeldon.config.ts'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  citation-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint citations under the Domain Pack policy
        run: pnpm run check:citations
